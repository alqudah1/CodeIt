<!doctype html>
<!-- One ad, three sizes. Rendered to PNG by render.cjs with real screenshots
     of the app passed in as data URLs. Nothing in the picture is a mock-up. -->
<html lang="en"><head><meta charset="utf-8">
<style>
  :root { --ink: #35220E; --cream: #FFF4E5; --orange: #FF7A00; --sun: #FFC93C; --green: #7FD86A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: var(--w); height: var(--h); overflow: hidden; background: var(--bg, var(--green)); font-family: 'Nunito', 'Trebuchet MS', sans-serif; color: var(--ink); position: relative; }
  @font-face { font-family: 'Baloo 2'; font-weight: 800; src: url('FONT_BALOO') format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 800; src: url('FONT_NUNITO8') format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 900; src: url('FONT_NUNITO9') format('woff2'); }
  .sky { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 40% at 20% 20%, #98E585 0 60%, transparent 61%), radial-gradient(ellipse 50% 30% at 85% 60%, #98E585 0 60%, transparent 61%); }
  .top { position: absolute; left: 64px; right: 64px; top: 56px; display: flex; align-items: center; justify-content: space-between; }
  .ey { font-size: 30px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); background: var(--sun); padding: 10px 22px; border-radius: 999px; border: 4px solid var(--ink); box-shadow: 0 6px 0 var(--ink); }
  .copy { position: absolute; left: 64px; right: 64px; top: var(--copytop, 170px); display: flex; flex-direction: column; gap: 22px; }
  h1 { margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: var(--h1, 112px); line-height: .98; letter-spacing: -.01em; color: var(--ink); text-shadow: 0 6px 0 #FFFFFF; }
  .sub { font-size: var(--subsize, 40px); font-weight: 800; line-height: 1.25; color: #2F3B1F; }
  .phones { position: absolute; left: 0; right: 0; top: var(--phonetop, 560px); display: flex; justify-content: center; gap: 36px; align-items: flex-start; }
  .phone { width: var(--pw, 440px); border: 8px solid var(--ink); border-radius: 56px; overflow: hidden; background: #fff; box-shadow: 0 18px 0 var(--ink); }
  .phone img { display: block; width: 100%; height: var(--ph, 760px); object-fit: cover; object-position: top; }
  .phone.tilt-l { transform: rotate(-4deg) translateY(30px); }
  .phone.tilt-r { transform: rotate(4deg) translateY(30px); }
  .cta { position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%); font-size: 44px; font-weight: 900; background: var(--orange); color: #fff; padding: 26px 56px; border-radius: 999px; border: 5px solid var(--ink); box-shadow: 0 10px 0 var(--ink); white-space: nowrap; }
  .fine { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font-size: 24px; font-weight: 800; color: var(--ink); opacity: .85; }
  .logo { height: 110px; width: auto; }
</style></head>
<body>
  <div class="sky"></div>
  <div class="top"><div class="ey" id="ey">Ages 8 to 14</div><img class="logo" id="logo" alt=""></div>
  <div class="copy">
    <h1 id="h1">Python in your pocket.<br>Like a game.</h1>
    <div class="sub" id="sub">31 lessons on a map. A two-minute Python quest every day. Games they make themselves.</div>
  </div>
  <div class="phones" id="phones"></div>
  <div class="cta" id="cta">Free to start</div>
  <div class="fine" id="fine">codeitlearn.com</div>
</body></html>
