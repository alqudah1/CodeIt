# ── Why this exists ──────────────────────────────────────────────────────────
#
# There was no CI. Nothing ran the tests on push, on a pull request, or before a
# merge, so "did you run the suite?" was a question two people answered from
# memory. It went wrong the obvious way: a refactor that moved page titles into
# src/data/pageMeta.js shipped green because only the scripts/*.test.js suites
# had been run, and main sat red until somebody happened to run the React tests.
#
# Nobody was careless. The repo just had no way to notice.
#
# This runs everything on every push and every pull request. It does not touch
# the database and it does not deploy — see ops/db/migrate.js for why migrations
# stay a thing a person does on purpose.

name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Named separately rather than run as one command, so a red tick says
      # which half broke without anyone opening the log.
      - name: Backend tests
        run: npm test --workspace=@e-learning/codeit-backend

      - name: Frontend tests
        run: npm test --workspace=@e-learning/gamified-elearning -- --watchAll=false
        env:
          CI: true

      # api/share.js is the unfurl: the card WhatsApp draws when a child sends
      # "play my game" to three friends. It had no test at all, and it works by
      # string-replacing meta tags in the built index.html — so renaming a tag
      # in public/index.html would break every shared link with no error
      # anywhere and a homepage card in its place.
      - name: Share card tests
        run: npm run test:api

      # The node:test suites under scripts/ never ran here. They are the
      # guards on the things a browser test cannot see — the sitemap's dates, the
      # lesson count, the claims about the product, whether any page is orphaned
      # — and the workflow above was written after a refactor shipped green
      # because only these ran and the React suite did not. The same gap existed
      # in the other direction the whole time.
      - name: Search and schema guards
        run: npm run test:seo --workspace=@e-learning/gamified-elearning

      # The suite passing and the build failing are different things, and the
      # build is the one the visitor sees. CRA treats lint warnings as errors
      # when CI is set, which has caught two unused variables that tests did not.
      - name: Production build
        run: npm run build:learning
        env:
          CI: true

  # ── The tests that need a database ────────────────────────────────────────
  #
  # Some promises are about rows, and only a real Postgres can check them:
  # that deleting a child leaves nothing behind, that a classroom account is
  # told apart from a person's own account. Those tests lived only in
  # ops/checks/run-all.sh, inside the browser workflow, which has been
  # run-by-hand since 16 October. So they ran when someone remembered.
  #
  # That is how a deletion fix shipped without the fix in it: the list of
  # tables to clear was missing the two it was written to add, and nothing
  # that runs on a push could see it. This job runs them on every push,
  # against a database that exists for two minutes and is thrown away. It
  # never sees production, which stays a thing a person migrates on purpose.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: check
          POSTGRES_DB: codeit_check
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:check@localhost:5432/codeit_check
      # A throwaway key for a throwaway database.
      JWT_SECRET: check-runner-signing-key-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the schema from this repository's migrations
        run: node ops/db/migrate.js --fresh --apply

      - name: Database-backed tests
        run: npm run test:pg --workspace=@e-learning/codeit-backend
